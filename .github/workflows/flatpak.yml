# Linux: DogMute.flatpak. A v* tag adds it to that GitHub release (the Windows workflow makes the release).
name: flatpak
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version: {description: "Version written into the build (e.g. 1.3.0); empty = 0.0.0, which never reports updates", required: false, default: ""}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Version
        env: {IN_VERSION: "${{ inputs.version }}"}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="${IN_VERSION:-0.0.0}"; fi
          printf 'VERSION = "%s"   # written by the flatpak workflow; the updater compares it\n' "$v" > dogmute/_version.py
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: DogMute.flatpak
          manifest-path: flatpak/com.dogmosh.DogMute.yml
          cache-key: flatpak-${{ hashFiles('flatpak/python-deps.json') }}
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with: {name: DogMute-flatpak, path: DogMute.flatpak}

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/download-artifact@v8
        with: {name: DogMute-flatpak}
      - name: Add to the release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |   # the Windows workflow creates the release after its tests: wait for it
          for i in $(seq 1 100); do
            gh release upload "$GITHUB_REF_NAME" DogMute.flatpak --clobber -R "$GITHUB_REPOSITORY" && exit 0
            sleep 60
          done
          exit 1
