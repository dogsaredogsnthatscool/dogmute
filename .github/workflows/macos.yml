# Installs DogMute on GitHub's Macs (Apple Silicon and Intel) the way a person would, then checks the sound helper,
# runs the tests, has macOS's own voice say the test word to the speech model, and records that voice through
# ScreenCaptureKit (GitHub's Macs come with the capture permission a person would otherwise allow).
name: macOS
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install (no background service)
        run: DOGMUTE_NO_OPEN=1 ./install.sh --no-service || { cat bin/build.log 2>/dev/null; exit 1; }
      - name: Sound helper
        run: |
          bin/dogmute-listen list | python3 -c 'import json, sys; d = json.load(sys.stdin); print(d); assert {"screen", "apps", "devices"} <= d.keys()'
          set +e
          bin/dogmute-listen device "MacBook Pro Microphone"; c=$?; echo "microphone refused: exit $c"; [ $c = 2 ] || exit 1
          bin/dogmute-listen app com.hnc.Discord; c=$?; echo "no permission here: exit $c"; [ $c = 2 ] || [ $c = 3 ] || exit 1
          bin/dogmute-listen nonsense; c=$?; [ $c = 2 ] || exit 1
      - name: Tests
        run: |
          .venv/bin/pip install -q -r requirements-dev.txt
          .venv/bin/python -m pytest -q
      - name: Speech (macOS says the test word)
        run: |
          say -o k.aiff "Okay everyone, please say kangaroo now."
          afconvert -f WAVE -d LEI16@16000 -c 1 k.aiff k.wav
          .venv/bin/python - <<'PY'
          import time, types, wave
          import numpy as np
          from dogmute import stt
          f = wave.open("k.wav")
          x = np.frombuffer(f.readframes(f.getnframes()), np.int16).astype(np.float32) / 32768
          for device in ("auto", "cpu"):
              li = stt.Listener(types.SimpleNamespace(cfg={"stt": {"model": "distil-large-v3", "threads": 3, "device": device}}))
              li._load()
              t = time.monotonic()
              heard = [w for w, a, b in li.transcribe(x, 0.0)]
              print(device, "->", li.status, f"{(time.monotonic() - t) * 1000:.0f} ms", heard, flush=True)
              assert any("kangaroo" in w.lower() for w in heard), heard
          PY
      - name: Screen capture (macOS's voice through ScreenCaptureKit, then the speech model)
        run: |
          bin/dogmute-listen all > cap.raw 2> cap.err & pid=$!
          sleep 3
          say "Okay everyone, please say kangaroo now."
          sleep 1
          kill $pid 2>/dev/null || true
          cat cap.err
          .venv/bin/python - <<'PY'
          import types
          import numpy as np
          from dogmute import stt
          x = np.fromfile("cap.raw", np.float32)
          print(f"{len(x) / 16000:.1f} s captured, peak {np.abs(x).max() if len(x) else 0:.3f}", flush=True)
          assert len(x) > 16000 and np.abs(x).max() > 0.01, "no sound came through"
          li = stt.Listener(types.SimpleNamespace(cfg={"stt": {"model": "distil-large-v3", "threads": 3, "device": "auto"}}))
          li._load()
          heard = [w for w, a, b in li.transcribe(x, 0.0)]
          print(li.status, heard, flush=True)
          assert any("kangaroo" in w.lower() for w in heard), heard
          PY
