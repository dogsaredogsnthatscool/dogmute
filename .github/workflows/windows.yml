# Windows: the tests (with speech played through a virtual sound card and heard per program), then DogMute-Setup.exe,
# installed and checked on a clean runner. A v* tag publishes the installer as a GitHub release.
name: windows
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version: {description: "Version written into the build (e.g. 1.2.0); empty = 0.0.0, which never self-updates", required: false, default: ""}
permissions:
  contents: write
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.13"}
      - name: MSVC (the Visual Studio C++ environment, as a Developer PowerShell has it)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV }
          }
      - uses: LABSN/sound-ci-helpers@v1
      - name: OBS Studio (its virtual camera is what Discord picks)
        run: choco install obs-studio -y --no-progress
      - name: Sound helper
        run: |
          mkdir bin, build -Force | Out-Null
          cl /nologo /O2 /EHsc /std:c++17 /W3 win\listen.cpp /Fo:build\ /Fe:bin\dogmute-listen.exe ole32.lib shell32.lib version.lib
          if ($LASTEXITCODE) { exit 1 }
          bin\dogmute-listen.exe list
      - name: Packages
        run: pip install -q -r requirements.txt -r requirements-dev.txt
      - name: Tests
        env: {DOGMUTE_WIN_AUDIO: "1", DOGMUTE_WIN_CAMERA: "1", PYTHONUTF8: "1"}
        run: python -m pytest -q -rs -s tests

  installer:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.13"}
      - name: MSVC (the Visual Studio C++ environment, as a Developer PowerShell has it)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV }
          }
      - uses: LABSN/sound-ci-helpers@v1
      - name: Inno Setup
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build
        env: {IN_VERSION: "${{ inputs.version }}"}
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } elseif ($env:IN_VERSION) { $env:IN_VERSION } else { "0.0.0" }
          win\build.ps1 -Version $v -Python python
      - name: Install, run, uninstall
        run: win\smoke.ps1
      - uses: actions/upload-artifact@v7
        with: {name: DogMute-Setup, path: dist/DogMute-Setup.exe}
      - name: Release
        if: github.ref_type == 'tag'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |   # the Flatpak workflow may have made the release first: then add the installer to it
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE) { gh release create $env:GITHUB_REF_NAME dist\DogMute-Setup.exe --title "DogMute $env:GITHUB_REF_NAME" --notes-file release-notes.md }
          else { gh release upload $env:GITHUB_REF_NAME dist\DogMute-Setup.exe --clobber }
          if ($LASTEXITCODE) { exit 1 }
