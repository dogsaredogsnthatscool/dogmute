<!doctype html>
<!-- DogMute's overlay for OBS Studio: a Browser source at http://127.0.0.1:8853/obs, on top of your scene (dogmute/obs.py
     adds it). Each mute plays the clip, keyed (green screen by default), with the killcam's name, hitmarker, +100 and
     killfeed line (the same timeline as dogmute/killcam.py). Transparent the rest of the time; silent if DogMute is off. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>DogMute overlay</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { font: 700 1px "DejaVu Sans", Verdana, sans-serif; color: #fff; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; }
  .l { position: fixed; opacity: 0; white-space: nowrap; text-shadow: .2vh .2vh 0 rgba(0, 0, 0, .67);
       will-change: opacity, transform; pointer-events: none; }
  #name { left: 50%; top: 50%; font-size: 11vh; line-height: 1; transform: translate(-50%, -60%) scaleX(.86); }
  #name.shot { color: rgb(255, 70, 55); }
  #hit { left: 50%; top: 50%; width: 9.2vh; height: 9.2vh; margin: -4.6vh 0 0 -4.6vh; }
  #xp { left: calc(50% + 3vw); top: 57.5%; font-size: 6vh; color: rgb(255, 246, 170); transform-origin: 0 0; }
  #feed { left: 3vw; top: 82%; font-size: 5.2vh; line-height: 1; display: flex; align-items: center; gap: 2.6vh; }
  #feed .by { color: rgb(140, 230, 140); }
  #feed .who { color: rgb(255, 96, 80); }
  #feed svg { height: 4.9vh; width: auto; filter: drop-shadow(.2vh .2vh 0 rgba(0, 0, 0, .63)); }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="l" id="name"></div>
<svg class="l" id="hit" viewBox="0 0 92 92" aria-hidden="true">
  <g stroke-linecap="butt">
    <path d="M58 58L92 92M34 58L0 92M58 34L92 0M34 34L0 0" stroke="rgba(40,40,40,.8)" stroke-width="8"/>
    <path d="M58 58L92 92M34 58L0 92M58 34L92 0M34 34L0 0" stroke="#fff" stroke-width="6"/>
  </g>
</svg>
<div class="l" id="xp">+100</div>
<div class="l" id="feed"><span class="by"></span>
  <svg viewBox="0 0 100 28" aria-hidden="true" fill="#fff" fill-opacity=".92">
    <polygon points="0,15 6,13 30,12 34,10 64,10 66,12 100,12 100,15 66,15 60,17 40,17 36,26 31,26 32,18 20,18 14,25 2,25 0,20"/>
    <rect x="36" y="3" width="26" height="6" rx="2"/><rect x="44" y="9" width="2" height="2"/><rect x="54" y="9" width="2" height="2"/>
  </svg><span class="who"></span></div>
<video id="clip" muted playsinline preload="auto" hidden></video>
<script>
"use strict";
// the timeline of dogmute/killcam.py (seconds; h = time since the shot)
const HIT_S = 0.22, NAME_S = 1.8, HITMARK_S = 0.32, XP_S = 1.4, FEED_S = 4.5;
const $ = id => document.getElementById(id);
const video = $("clip");
let cv = $("gl");
const L = { name: $("name"), hit: $("hit"), xp: $("xp"), feed: $("feed") };
let clipUrl = "", clipOk = false, key = "green", hitAt = 0, last = null, m = null;

// ---- the clip, keyed on the GPU: green (green screen drops out), screen (black drops out) or full ----
let gl = cv.getContext("webgl", { premultipliedAlpha: true, alpha: true });
let prog, tex, uKey, uScale;
if (gl) {
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, `attribute vec2 p; uniform vec2 sc; varying vec2 uv;
    void main() { uv = (p * sc) * vec2(.5, -.5) + .5; gl_Position = vec4(p, 0., 1.); }`));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, `precision mediump float; uniform sampler2D t; uniform int k; varying vec2 uv;
    void main() {
      vec3 c = texture2D(t, uv).rgb;
      if (k == 0) {                                   // green screen: how much greener than red/blue, then despill
        float m = max(c.r, c.b), a = 1. - smoothstep(.08, .28, c.g - m);
        c.g = min(c.g, m + .04);
        gl_FragColor = vec4(c * a, a);
      } else if (k == 1) {                            // black drops out (screen-style clips)
        float a = smoothstep(.02, .25, max(c.r, max(c.g, c.b)));
        gl_FragColor = vec4(c * a, a);
      } else gl_FragColor = vec4(c, 1.);
    }`));
  gl.linkProgram(prog); gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const p = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(p); gl.vertexAttribPointer(p, 2, gl.FLOAT, false, 0, 0);
  tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR],
                        [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
  uKey = gl.getUniformLocation(prog, "k"); uScale = gl.getUniformLocation(prog, "sc");
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {   // a GPU that can't build it: a fresh canvas for the fallback
    const n = document.createElement("canvas"); cv.replaceWith(n); cv = n; gl = null;
  }
}
// no WebGL (OBS with its browser's GPU use off): the same key on the processor, at half size
const c2 = gl ? null : cv.getContext("2d"), off = document.createElement("canvas");
const o2 = off.getContext("2d", { willReadFrequently: true });
function clear() {
  if (gl) { gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); } else if (c2) c2.clearRect(0, 0, cv.width, cv.height);
}
function drawClip2d() {
  const W = cv.width = innerWidth, H = cv.height = innerHeight;
  if (!video.videoWidth || video.readyState < 2) return;
  const w = off.width = video.videoWidth >> 1, h = off.height = video.videoHeight >> 1;
  o2.drawImage(video, 0, 0, w, h);
  const img = o2.getImageData(0, 0, w, h), d = img.data;
  const ss = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;
    if (key === "green") { const mx = Math.max(r, b); d[i + 3] = 255 * (1 - ss(.08, .28, g - mx)); d[i + 1] = 255 * Math.min(g, mx + .04); }
    else if (key === "screen") d[i + 3] = 255 * ss(.02, .25, Math.max(r, g, b));
  }
  o2.putImageData(img, 0, 0);
  const s = Math.max(W / w, H / h);
  c2.drawImage(off, (W - w * s) / 2, (H - h * s) / 2, w * s, h * s);
}
function drawClip() {
  if (!gl) return c2 && drawClip2d();
  const W = cv.width = innerWidth * devicePixelRatio | 0, H = cv.height = innerHeight * devicePixelRatio | 0;
  gl.viewport(0, 0, W, H); clear();
  if (!video.videoWidth || video.readyState < 2) return;
  // cover, like the killcam: fill the picture, crop the overflow
  const s = Math.max(W / video.videoWidth, H / video.videoHeight);
  gl.uniform2f(uScale, W / (video.videoWidth * s), H / (video.videoHeight * s));
  gl.uniform1i(uKey, key === "green" ? 0 : key === "screen" ? 1 : 2);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, video);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

async function loadClip(url) {
  clipUrl = url; clipOk = false;
  try {                                            // as a blob: rewinding works without range requests
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const b = URL.createObjectURL(await r.blob());
    if (video.src.startsWith("blob:")) URL.revokeObjectURL(video.src);
    video.src = b;
    await new Promise((ok, bad) => { video.onloadeddata = ok; video.onerror = bad; });
    clipOk = url === clipUrl;
  } catch { clipOk = false; }                      // no clip: the name, hitmarker and killfeed still play
}

// ---- one mute ----
function fit(el, text, maxW) {
  el.textContent = text; el.style.fontSize = "";
  const w = el.getBoundingClientRect().width;
  if (w > maxW) el.style.fontSize = `calc(${getComputedStyle(el).fontSize} * ${maxW / w})`;
}
function start(ev) {
  const name = ev.name || "?";
  fit(L.name, name, innerWidth * 0.8);
  L.feed.querySelector(".by").textContent = ev.by || "";
  L.feed.querySelector(".by").hidden = !ev.by;
  L.feed.querySelector(".who").textContent = name;
  const playing = clipOk;
  if (playing) { video.currentTime = 0; video.play().catch(() => {}); }
  m = { t0: performance.now(), clip: playing,
        hit: playing ? (hitAt > 0 ? hitAt : video.duration || HIT_S) : HIT_S };
  requestAnimationFrame(tick);
}
const set = (el, o, tf) => { el.style.opacity = Math.max(0, Math.min(1, o)); if (tf !== undefined) el.style.transform = tf; };
function tick(now) {
  if (!m) return;
  const e = (now - m.t0) / 1000, h = e - m.hit;
  if (m.clip && !video.ended) drawClip(); else clear();
  const pop = 0 <= h && h < 0.12 ? 1 + 0.2 * (1 - h / 0.12) : 1;
  L.name.classList.toggle("shot", h >= 0);
  set(L.name, h < NAME_S ? Math.min(1, e / 0.12) * Math.min(1, (NAME_S - h) / 0.4) : 0,
      `translate(-50%, -60%) scale(${0.86 * pop}, ${pop})`);
  set(L.hit, 0 <= h && h < HITMARK_S ? Math.min(1, (HITMARK_S - h) / 0.12) : 0,
      `scale(${h < 0.1 ? 1 + 0.25 * (1 - Math.max(0, h) / 0.1) : 1})`);
  set(L.xp, 0 <= h && h < XP_S ? Math.min(1, (XP_S - h) / 0.4) : 0, `translateY(${-3 * Math.max(0, h) / XP_S}vh)`);
  set(L.feed, 0 <= h && h < FEED_S ? Math.min(1, (FEED_S - h) / 0.5) * Math.min(1, h / 0.08) : 0);
  if (h >= FEED_S && (!m.clip || video.ended)) { m = null; clear(); return; }
  requestAnimationFrame(tick);
}

// ---- DogMute: asked four times a second; quiet (and keeps asking) while it isn't running ----
async function poll() {
  let wait = 250;
  try {
    const s = await (await fetch("/api/overlay", { cache: "no-store" })).json();
    key = s.key; hitAt = s.hit_at;
    if (s.clip !== clipUrl) await loadClip(s.clip);
    if (last !== null && s.n > last && s.event && Date.now() / 1000 - s.event.t < 10) start(s.event);
    last = s.n;
  } catch { wait = 2000; last = null; }            // DogMute restarting: don't replay the last mute when it's back
  setTimeout(poll, wait);
}
poll();
</script>
</body>
</html>
